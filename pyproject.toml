[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-app-packager"
version = "0.1.0"
description = "Local container packaging and offline AWS infrastructure files"
requires-python = ">=3.13,<3.14"
dependencies = ["streamlit>=1.45,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: opt-in real local containers"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = [".work", ".tools", ".venv", "exports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

